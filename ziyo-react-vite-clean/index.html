<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- description/og tags are managed per-page by react-helmet-async (src/components/SeoHead.jsx) -->
    <title>ZIYO</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ziyo_theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
